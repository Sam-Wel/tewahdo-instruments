<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin · ዝማሬ</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  .admin-wrap { max-width: 640px; margin: 2rem auto; padding: 0 1rem 3rem; }
  .admin-lock { max-width: 360px; margin: 4rem auto; text-align: center; }
  .admin-lock input { width: 100%; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--fg); margin-bottom: 0.6rem; }
  .admin-form { display: grid; gap: 0.7rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; margin-bottom: 1.5rem; }
  .admin-form label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
  .admin-form input, .admin-form select, .admin-form textarea {
    width: 100%; padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-elevated); color: var(--fg); font-family: inherit; font-size: 0.92rem;
  }
  .admin-form textarea { min-height: 140px; white-space: pre-wrap; }
  .admin-actions { display: flex; gap: 0.6rem; }
  .btn { border: none; border-radius: 8px; padding: 0.6rem 1rem; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--maroon)); color: #fff8ec; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--fg); }
  .btn-danger { background: transparent; border: 1px solid var(--maroon); color: var(--maroon); }
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
  .admin-row-title { font-weight: 600; }
  .admin-row-meta { color: var(--muted); font-size: 0.8rem; }
  .admin-row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
  .admin-row-actions button { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-amharic">ዝማሬ</span>
      <span class="brand-translit">Admin</span>
    </a>
  </div>
  <div class="ornament-divider" aria-hidden="true"></div>
</header>

<div id="lockScreen" class="admin-lock">
  <p>Enter the admin password to manage mezmur entries.</p>
  <input type="password" id="pwInput" placeholder="Password" />
  <button class="btn btn-primary" id="unlockBtn">Unlock</button>
  <p id="lockError" class="section-intro"></p>
</div>

<div id="adminWrap" class="admin-wrap" style="display:none;">
  <h2 id="formTitle">Add mezmur</h2>
  <form class="admin-form" id="mezmurForm">
    <input type="hidden" id="entryId" />
    <div>
      <label for="fTitle">Title</label>
      <input type="text" id="fTitle" required />
    </div>
    <div>
      <label for="fTopic">Themes / topics (comma-separated, a mezmur can have more than one)</label>
      <input type="text" id="fTopic" placeholder="e.g. Praise, St. Mary" required />
    </div>
    <div>
      <label for="fLanguage">Language</label>
      <select id="fLanguage">
        <option>Amharic</option>
        <option>Tigrinya</option>
        <option>Ge'ez</option>
        <option>Other</option>
      </select>
    </div>
    <div>
      <label for="fSpeed">Speed</label>
      <select id="fSpeed">
        <option value="slow">Slow</option>
        <option value="medium">Medium</option>
        <option value="fast">Fast</option>
      </select>
    </div>
    <div>
      <label for="fMedia">Recording / YouTube link (optional)</label>
      <input type="url" id="fMedia" placeholder="https://..." />
    </div>
    <div>
      <label for="fLyrics">Lyrics</label>
      <textarea id="fLyrics" required></textarea>
    </div>
    <div class="admin-actions">
      <button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
      <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel edit</button>
    </div>
    <p id="formStatus" class="section-intro"></p>
  </form>

  <h2>Existing entries</h2>
  <input type="search" id="adminSearch" placeholder="Search by title..." style="width:100%;padding:0.55rem 0.7rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--fg);margin-bottom:1rem;" />
  <div id="adminList"></div>
</div>

<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
